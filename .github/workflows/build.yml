name: Build Installer for Windows and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          winget install --accept-package-agreements --accept-source-agreements --disable-interactivity --id zig.zig --exact --source winget --version 0.14.0
          Write-Output -InputObject "${env:LOCALAPPDATA}\Microsoft\Winget\Links" | Out-File -FilePath "$env:GITHUB_PATH" -Encoding utf8 -Append

      - name: Build Installer
        run: |
          zig build -Doptimize=ReleaseSmall

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: "**/ssh-rdp ${{ github.ref_name }}.exe"
